version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gnani-emi-voice-agent:latest
    container_name: gnani-emi-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Wired to the mongo service below; overrides whatever is in .env so
      # `docker compose up` always talks to the bundled Mongo instance.
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-gnani_emi}
    depends_on:
      - mongo
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: gnani-emi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
